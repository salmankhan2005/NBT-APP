<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBT Logistics — Driver Mobile App Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B1120;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #FEA619;
      --primary-glow: rgba(254, 166, 25, 0.25);
      --success: #10B981;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --header-h: 70px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1E293B 0%, #0B1120 100%);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: var(--header-h);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #D97706, #B45309);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .brand-info h1 {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .demo-pill {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      background: linear-gradient(90deg, #F59E0B, #D97706);
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .brand-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #FBBF24;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F59E0B;
      box-shadow: 0 0 8px #F59E0B;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #F1F5F9;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #D97706, #B45309);
      border-color: #F59E0B;
      color: #fff;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      height: calc(100vh - var(--header-h));
    }

    .phone-wrapper {
      width: 390px;
      height: 780px;
      background: #000;
      border-radius: 50px;
      padding: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 4px #1E293B;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .phone-notch {
      width: 120px;
      height: 24px;
      background: #000;
      border-radius: 0 0 16px 16px;
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notch-camera {
      width: 10px;
      height: 10px;
      background: #0F172A;
      border-radius: 50%;
    }

    .phone-screen {
      flex: 1;
      border-radius: 40px;
      overflow: hidden;
      background: #0F172A;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0F172A;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">DRV</div>
      <div class="brand-info">
        <h1>Driver Mobile App <span class="demo-pill">Standalone Demo</span></h1>
        <p>Zero-Database Pre-loaded Driver Mobile Application with Trip Management & Expense Logger</p>
      </div>
    </div>

    <div class="controls">
      <div class="sync-status">
        <span class="sync-dot"></span>
        <span>Driver Engine Ready</span>
      </div>

      <button class="action-btn primary" onclick="loginDriver('123456')">
        🚚 Driver Senthil (PIN 123456)
      </button>

      <button class="action-btn primary" onclick="loginDriver('654321')">
        🚚 Driver Karthik (PIN 654321)
      </button>

      <button class="action-btn" onclick="window.open('/driver/', '_blank')">
        ↗ Fullscreen Mobile
      </button>
    </div>
  </header>

  <main>
    <div class="phone-wrapper">
      <div class="phone-notch">
        <div class="notch-camera"></div>
      </div>
      <div class="phone-screen">
        <iframe id="driverFrame" src="/driver/"></iframe>
      </div>
    </div>
  </main>

  <script>
    function loginDriver(pin) {
      const frame = document.getElementById('driverFrame');
      try {
        frame.contentWindow.localStorage.setItem('session_pin', pin);
        frame.contentWindow.location.reload();
      } catch (e) {
        frame.src = frame.src;
      }
    }
  </script>
</body>
</html>
