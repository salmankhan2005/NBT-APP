<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBT Logistics — Admin Command Portal Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B1120;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #38BDF8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --secondary: #FEA619;
      --success: #10B981;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --header-h: 70px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1E293B 0%, #0B1120 100%);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: var(--header-h);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #0284C7, #0369A1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .brand-info h1 {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .demo-pill {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      background: linear-gradient(90deg, #0284C7, #38BDF8);
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .brand-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34D399;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #F1F5F9;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #0284C7, #0369A1);
      border-color: #38BDF8;
      color: #fff;
    }

    .action-btn.primary:hover {
      box-shadow: 0 0 16px var(--primary-glow);
    }

    main {
      flex: 1;
      padding: 16px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--header-h));
    }

    .admin-viewport {
      flex: 1;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .window-header {
      background: #0F172A;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .window-dots { display: flex; gap: 6px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot.red { background: #EF4444; }
    .dot.yellow { background: #F59E0B; }
    .dot.green { background: #10B981; }

    .window-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .window-url-bar {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #94A3B8;
      font-family: 'JetBrains Mono', monospace;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0B1120;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">NBT</div>
      <div class="brand-info">
        <h1>Admin Command Portal <span class="demo-pill">Standalone Demo</span></h1>
        <p>Zero-Database Pre-loaded Operations Management & Live Fleet Tracking</p>
      </div>
    </div>

    <div class="controls">
      <div class="sync-status">
        <span class="sync-dot"></span>
        <span>Mock Engine Active</span>
      </div>

      <button class="action-btn primary" onclick="autoLoginAdmin()">
        ⚡ 1-Click Login Admin
      </button>

      <button class="action-btn" onclick="resetDatabase()">
        🔄 Reset Mock Data
      </button>

      <button class="action-btn" onclick="window.open('/admin/', '_blank')">
        ↗ Fullscreen Admin
      </button>
    </div>
  </header>

  <main>
    <div class="admin-viewport">
      <div class="window-header">
        <div class="window-dots">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        <div class="window-title">
          <span>🖥️ NBT Admin Operations Portal</span>
        </div>
        <div class="window-url-bar">
          <span>https://nbt-admin.demo/admin</span>
        </div>
      </div>
      <iframe id="adminFrame" src="/admin/"></iframe>
    </div>
  </main>

  <script>
    function autoLoginAdmin() {
      const frame = document.getElementById('adminFrame');
      try {
        frame.contentWindow.localStorage.setItem('admin_session_token_web', 'MOCK_SUPER_ADMIN_TOKEN_999');
        frame.contentWindow.localStorage.setItem('admin_username_web', 'NBT Super Admin');
        frame.contentWindow.location.reload();
      } catch (e) {
        frame.src = frame.src;
      }
    }

    function resetDatabase() {
      const frame = document.getElementById('adminFrame');
      try {
        frame.contentWindow.localStorage.clear();
        frame.contentWindow.location.reload();
      } catch (e) {
        frame.src = frame.src;
      }
    }
  </script>
</body>
</html>
