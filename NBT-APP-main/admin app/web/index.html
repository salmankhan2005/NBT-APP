<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>NBT & ARS Fleet Transit — Admin Command Portal</title>
    
    <!-- PWA & Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NBT+ARS Admin" />
    <meta name="application-name" content="NBT+ARS Admin" />
    <meta name="theme-color" content="#031635" />
    <meta name="description" content="NBT + ARS Fleet Transit Logistics & Admin Command Portal" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* Reset & Safe Area Handling */
      html, body, #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background-color: #031635;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        overscroll-behavior: none;
      }

      /* Apple Safe Area Insets CSS Variables */
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }

      /* Smooth WebKit Touch Scrolling */
      * {
        -webkit-overflow-scrolling: touch;
        box-sizing: border-box;
      }

      /* Focus Ring Accessibility */
      :focus-visible {
        outline: 2px solid #fc7728 !important;
        outline-offset: 2px !important;
      }

      /* Custom Modern Scrollbars for Desktop & macOS */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(3, 22, 53, 0.25);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(252, 119, 40, 0.6);
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run NBT + ARS Fleet Transit Admin Portal.</noscript>
    <div id="root"></div>
  </body>
</html>
